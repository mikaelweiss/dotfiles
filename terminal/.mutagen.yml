# Defaults for new mutagen sync sessions. Ignores are locked into a session
# when it is created, so recreate sessions (sync-setup) after changing them.
# Artifact names come from the github/gitignore templates for each ecosystem.
# A pattern containing a slash anchors to the session root, ~/code/dotfiles.
sync:
  defaults:
    ignore:
      paths:
        # macOS
        - ".DS_Store"
        # Node
        - "node_modules"
        - "dist"
        - "build"
        - "coverage"
        - ".next"
        - ".turbo"
        - ".expo"
        - ".cache"
        - ".vite"
        - ".parcel-cache"
        - ".nx"
        - ".angular"
        # Xcode / Swift
        - "xcuserdata"
        - "DerivedData"
        - ".build"
        - ".build-*"
        - ".swiftpm"
        # Agent-chosen -derivedDataPath folders
        - ".dd"
        - ".dd-*"
        # Rust
        - "target"
        # Elixir / Phoenix
        - "_build"
        - "deps"
        - ".elixir_ls"
        - ".expert"
        - "erl_crash.dump"
        # Java / Android
        - ".gradle"
        # Python
        - "__pycache__"
        - ".venv"
        - ".pytest_cache"
        - ".ruff_cache"
        - ".mypy_cache"
        # direnv
        - ".direnv"
        # Transient git lock files
        - "index.lock"
        # Worktrunk cache, hook logs, and trash. Per machine and rebuildable.
        - "**/.git/wt"
        # Agent caches and agent-made worktrees
        - "image-cache"
        - "**/.claude/worktrees"
        # Machine-local Xcode state that stow links into xcode
        # (~/Library/Developer points there); untracked by git
        - "/xcode/Library/Developer/CoreSimulator"
        - "/xcode/Library/Developer/XCTestDevices"
        - "/xcode/Library/Developer/XCPGDevices"
        - "/xcode/Library/Developer/DVTDownloads"
        - "/xcode/Library/Developer/Xcode/iOS DeviceSupport"
        - "/xcode/Library/Developer/Xcode/CodingAssistant"
        - "/xcode/Library/Developer/Xcode/Products"
        - "/xcode/Library/Developer/Xcode/Archives"
        - "/xcode/Library/Developer/MobileBuildMCP"
        # Live per-machine Claude Code state that stow links into
        # dotfiles/claude (~/.claude points there); untracked by git.
        # Shared config (settings, skills, agents, plugins, CLAUDE.md) and
        # session transcripts (projects/) sync, so `claude --resume` works anywhere.
        - "/claude/.claude/telemetry"
        - "/claude/.claude/file-history"
        - "/claude/.claude/shell-snapshots"
        - "/claude/.claude/history.jsonl"
        - "/claude/.claude/todos"
        - "/claude/.claude/statsig"
        - "/claude/.claude/cache"
        - "/claude/.claude/backups"
        - "/claude/.claude/plans"
        - "/claude/.claude/debug"
        - "/claude/.claude/logs"
        - "/claude/.claude/ide"
        - "/claude/.claude/session-env"
        - "/claude/.claude/remote"
        - "/claude/.claude/.credentials.json"
        # Live per-machine Codex state (~/.codex is stow-linked); the SQLite
        # databases would corrupt if two machines wrote them through sync
        - "/codex/.codex/*.sqlite*"
        - "/codex/.codex/sessions"
        - "/codex/.codex/shell_snapshots"
        - "/codex/.codex/cache"
        - "/codex/.codex/models_cache.json"
        - "/codex/.codex/history.jsonl"
        - "/codex/.codex/auth.json"
        - "/codex/.codex/ipc"
        - "/codex/.codex/worktrees"
